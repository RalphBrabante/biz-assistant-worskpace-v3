name: Deploy to Staging

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to deploy
        required: true
        default: develop

# Prevent concurrent staging deployments
concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  API_IMAGE: ghcr.io/ralphbrabante/biz-assistant-api
  NGINX_IMAGE: ghcr.io/ralphbrabante/biz-assistant-nginx

jobs:
  build:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GH_PAT || github.token }}
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Angular client
        working-directory: client
        run: |
          npm ci --no-audit --no-fund --include=optional
          npm install --no-save @rollup/rollup-linux-x64-gnu
          npm run build -- --configuration production --source-map=false

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: ./api
          push: true
          tags: |
            ${{ env.API_IMAGE }}:staging
            ${{ env.API_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=api-staging
          cache-to: type=gha,mode=max,scope=api-staging

      - name: Prepare Nginx build context
        run: |
          mkdir -p /tmp/nginx-ctx/dist
          cp -r client/dist/angular-client/browser/. /tmp/nginx-ctx/dist/
          cp nginx/Dockerfile /tmp/nginx-ctx/

      - name: Build and push Nginx image
        uses: docker/build-push-action@v5
        with:
          context: /tmp/nginx-ctx
          push: true
          tags: |
            ${{ env.NGINX_IMAGE }}:staging
            ${{ env.NGINX_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=nginx-staging
          cache-to: type=gha,mode=max,scope=nginx-staging

  deploy:
    name: Deploy to Droplet
    runs-on: ubuntu-latest
    needs: build
    environment: staging

    steps:
      - name: Checkout (for config files)
        uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.STAGING_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy config files to droplet
        env:
          HOST: ${{ secrets.STAGING_HOST }}
          USER: ${{ secrets.STAGING_USER }}
          PORT: ${{ secrets.STAGING_SSH_PORT || 22 }}
          PATH_: ${{ secrets.STAGING_DEPLOY_PATH }}
        run: |
          SCP="scp -i ~/.ssh/deploy_key -P $PORT"
          SSH="ssh -i ~/.ssh/deploy_key -p $PORT $USER@$HOST"

          $SSH "mkdir -p $PATH_/nginx $PATH_/redis $PATH_/rabbitmq $PATH_/mysql/conf.d"
          $SCP docker-compose.staging.yml    "$USER@$HOST:$PATH_/"
          $SCP nginx/default.ssl.conf        "$USER@$HOST:$PATH_/nginx/"
          $SCP redis/redis.conf              "$USER@$HOST:$PATH_/redis/"
          $SCP rabbitmq/rabbitmq.conf        "$USER@$HOST:$PATH_/rabbitmq/"
          $SCP mysql/conf.d/my.cnf           "$USER@$HOST:$PATH_/mysql/conf.d/"

      - name: Pull images and restart services
        env:
          HOST: ${{ secrets.STAGING_HOST }}
          USER: ${{ secrets.STAGING_USER }}
          PORT: ${{ secrets.STAGING_SSH_PORT || 22 }}
          DEPLOY_PATH: ${{ secrets.STAGING_DEPLOY_PATH }}
          GHCR_TOKEN: ${{ secrets.GH_PAT }}
          GHCR_USER: ${{ github.repository_owner }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$PORT" "$USER@$HOST" \
            DEPLOY_PATH="$DEPLOY_PATH" \
            GHCR_TOKEN="$GHCR_TOKEN" \
            GHCR_USER="$GHCR_USER" \
            bash -s << 'ENDSSH'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          docker compose -p staging -f docker-compose.staging.yml --env-file .env.staging pull
          docker compose -p staging -f docker-compose.staging.yml --env-file .env.staging up -d --remove-orphans
          docker image prune -f
          ENDSSH
