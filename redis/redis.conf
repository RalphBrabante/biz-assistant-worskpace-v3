# Lean Redis profile for small instances.
# Reachable only on the internal Docker network; staging/production also enforce a password (--requirepass).
bind 0.0.0.0
port 6379
databases 16
timeout 0
tcp-keepalive 60
save ""
appendonly no
maxmemory 64mb
maxmemory-policy allkeys-lru
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
