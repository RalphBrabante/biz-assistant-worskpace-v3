services:
  mysql:
    image: mysql:8.4
    container_name: mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-appdb}
      MYSQL_USER: ${MYSQL_USER:-appuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-apppassword}
    expose:
      - "3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/conf.d/my.cnf:/etc/mysql/conf.d/zzz-tuned.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 384m
    cpus: 0.45
    networks:
      - backend

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    expose:
      - "6379"
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 96m
    cpus: 0.10
    networks:
      - backend

  amqp:
    image: rabbitmq:3-management-alpine
    container_name: amqp
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
      RABBITMQ_VM_MEMORY_HIGH_WATERMARK: ${RABBITMQ_VM_MEMORY_HIGH_WATERMARK:-0.25}
      RABBITMQ_DISK_FREE_LIMIT: ${RABBITMQ_DISK_FREE_LIMIT:-200MB}
    expose:
      - "5672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 256m
    cpus: 0.20
    networks:
      - backend

  api:
    build:
      context: ./api
    container_name: node-express
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NODE_OPTIONS: ${NODE_OPTIONS:---max-old-space-size=256}
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER:-appuser}
      DB_PASSWORD: ${MYSQL_PASSWORD:-apppassword}
      DB_NAME: ${MYSQL_DATABASE:-appdb}
      REDIS_URL: redis://redis:6379
      AMQP_URL: amqp://${RABBITMQ_DEFAULT_USER:-guest}:${RABBITMQ_DEFAULT_PASS:-guest}@amqp:5672
      DB_POOL_MAX: ${DB_POOL_MAX:-4}
      DB_POOL_MIN: ${DB_POOL_MIN:-0}
      DB_POOL_ACQUIRE_MS: ${DB_POOL_ACQUIRE_MS:-20000}
      DB_POOL_IDLE_MS: ${DB_POOL_IDLE_MS:-5000}
      DB_POOL_EVICT_MS: ${DB_POOL_EVICT_MS:-1000}
      DB_CONNECT_TIMEOUT_MS: ${DB_CONNECT_TIMEOUT_MS:-20000}
      JSON_BODY_LIMIT: ${JSON_BODY_LIMIT:-1mb}
      REDIS_CONNECT_TIMEOUT_MS: ${REDIS_CONNECT_TIMEOUT_MS:-10000}
      HTTP_KEEPALIVE_TIMEOUT_MS: ${HTTP_KEEPALIVE_TIMEOUT_MS:-5000}
      HTTP_HEADERS_TIMEOUT_MS: ${HTTP_HEADERS_TIMEOUT_MS:-6000}
      HTTP_REQUEST_TIMEOUT_MS: ${HTTP_REQUEST_TIMEOUT_MS:-30000}
    expose:
      - "3000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      amqp:
        condition: service_healthy
    volumes:
      - ./api/uploads:/usr/src/app/uploads
      - api_node_modules:/usr/src/app/node_modules
    command: sh -c "(npm run db:create || true) && npm run db:migrate && npm run start"
    mem_limit: 320m
    cpus: 0.35
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    networks:
      - frontend
      - backend

  client:
    build:
      context: ./client
    container_name: angular-client
    restart: unless-stopped
    environment:
      CHOKIDAR_USEPOLLING: "false"
    depends_on:
      - api
    command: npm run start -- --host 0.0.0.0 --configuration production
    expose:
      - "4200"
    mem_limit: 320m
    cpus: 0.20
    networks:
      - frontend

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    restart: unless-stopped
    depends_on:
      - client
      - api
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    mem_limit: 96m
    cpus: 0.10
    networks:
      - frontend

volumes:
  api_node_modules:
  mysql_data:
  redis_data:
  rabbitmq_data:

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true
