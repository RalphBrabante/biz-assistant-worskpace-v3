services:
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    expose:
      - "6379"
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 96m
    cpus: 0.10
    networks:
      - backend

  amqp:
    image: rabbitmq:3-management-alpine
    container_name: amqp
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    expose:
      - "5672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 256m
    cpus: 0.20
    networks:
      - backend

  api:
    build:
      context: ./api
    container_name: node-express
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NODE_OPTIONS: ${NODE_OPTIONS:---max-old-space-size=256}
      PORT: 3000
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      REDIS_URL: redis://redis:6379
      AMQP_URL: amqp://${RABBITMQ_DEFAULT_USER:-guest}:${RABBITMQ_DEFAULT_PASS:-guest}@amqp:5672
      DB_POOL_MAX: ${DB_POOL_MAX:-4}
      DB_POOL_MIN: ${DB_POOL_MIN:-0}
      DB_POOL_ACQUIRE_MS: ${DB_POOL_ACQUIRE_MS:-20000}
      DB_POOL_IDLE_MS: ${DB_POOL_IDLE_MS:-5000}
      DB_POOL_EVICT_MS: ${DB_POOL_EVICT_MS:-1000}
      DB_CONNECT_TIMEOUT_MS: ${DB_CONNECT_TIMEOUT_MS:-20000}
      DB_SSL: ${DB_SSL:-false}
      DB_SSL_REJECT_UNAUTHORIZED: ${DB_SSL_REJECT_UNAUTHORIZED:-true}
      DB_LOG_SQL: ${DB_LOG_SQL:-false}
      JSON_BODY_LIMIT: ${JSON_BODY_LIMIT:-1mb}
      REDIS_CONNECT_TIMEOUT_MS: ${REDIS_CONNECT_TIMEOUT_MS:-10000}
      HTTP_KEEPALIVE_TIMEOUT_MS: ${HTTP_KEEPALIVE_TIMEOUT_MS:-5000}
      HTTP_HEADERS_TIMEOUT_MS: ${HTTP_HEADERS_TIMEOUT_MS:-6000}
      HTTP_REQUEST_TIMEOUT_MS: ${HTTP_REQUEST_TIMEOUT_MS:-30000}
      APP_NAME: ${APP_NAME:-Biz Assistant}
      APP_BASE_URL: ${APP_BASE_URL:-https://localhost}
      RESET_PASSWORD_PATH: ${RESET_PASSWORD_PATH:-/reset-password}
      PASSWORD_RESET_EXPIRES_MINUTES: ${PASSWORD_RESET_EXPIRES_MINUTES:-30}
      VERIFY_EMAIL_PATH: ${VERIFY_EMAIL_PATH:-/verify-email}
      VERIFY_EMAIL_EXPIRES_MINUTES: ${VERIFY_EMAIL_EXPIRES_MINUTES:-60}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Biz Assistant}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-no-reply@bizassistant.local}
      SMTP2GO_API_KEY: ${SMTP2GO_API_KEY:-}
      SMTP2GO_API_URL: ${SMTP2GO_API_URL:-https://api.smtp2go.com/v3/email/send}
    expose:
      - "3000"
    depends_on:
      redis:
        condition: service_healthy
      amqp:
        condition: service_started
    volumes:
      - ./api/uploads:/usr/src/app/uploads
      - api_node_modules:/usr/src/app/node_modules
    command: sh -c "npm run db:migrate && npm run start"
    mem_limit: 320m
    cpus: 0.35
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    networks:
      - frontend
      - backend

  client:
    build:
      context: ./client
    container_name: angular-client
    restart: unless-stopped
    environment:
      CHOKIDAR_USEPOLLING: "false"
    depends_on:
      - api
    command: npm run start -- --host 0.0.0.0 --configuration production
    expose:
      - "4200"
    mem_limit: 320m
    cpus: 0.20
    networks:
      - frontend

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    restart: unless-stopped
    depends_on:
      - client
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.ssl.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    mem_limit: 96m
    cpus: 0.10
    networks:
      - frontend

volumes:
  api_node_modules:
  redis_data:
  rabbitmq_data:

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true
