<main class="login-shell py-12">
  <div class="mx-auto w-full max-w-7xl px-6">
    <div class="flex justify-center">
      <div class="w-full md:w-[83.3333%] lg:w-[58.3333%] xl:w-[41.6667%]">
        <section class="ui-card border-0 shadow-dialog rounded-xl overflow-hidden">
          <div class="brand-strip px-6 py-4">
            <span class="ui-badge ui-badge-light font-semibold">Biz Assistant Workspace</span>
          </div>

          <div class="ui-card-body p-6 md:p-12">
            <h1 class="text-2xl font-semibold tracking-tight mb-2 font-bold">Welcome Back</h1>
            <p class="text-muted mb-6">Sign in to continue to your dashboard.</p>

            <form (ngSubmit)="login()" #loginForm="ngForm" *ngIf="!isLoggedIn" novalidate>
              <div class="mb-4">
                <label for="email" class="ui-form-label font-semibold">Email Address</label>
                <input
                  id="email"
                  name="email"
                  type="email"
                  class="ui-form-control ui-form-control-lg"
                  [(ngModel)]="email"
                  required
                  autocomplete="username"
                  placeholder="you@example.com"
                />
              </div>

              <div class="mb-4">
                <label for="password" class="ui-form-label font-semibold">Password</label>
                <input
                  id="password"
                  name="password"
                  type="password"
                  class="ui-form-control ui-form-control-lg"
                  [(ngModel)]="password"
                  required
                  autocomplete="current-password"
                  placeholder="Enter your password"
                />
              </div>

              <div class="grid mt-6">
                <button
                  type="submit"
                  class="ui-btn ui-btn-primary ui-btn-lg font-semibold"
                  [disabled]="isSubmitting || !loginForm.form.valid"
                >
                  <span *ngIf="!isSubmitting">Sign In</span>
                  <span *ngIf="isSubmitting">Signing in...</span>
                </button>
              </div>
            </form>

            <div class="logged-in" *ngIf="isLoggedIn">
              <div class="ui-alert ui-alert-success border-0 font-semibold mb-4" role="alert">
                You are logged in.
              </div>

              <label class="ui-form-label font-semibold">Access Token</label>
              <textarea class="ui-form-control" rows="4" readonly>{{ accessToken }}</textarea>

              <div class="grid mt-4">
                <button class="ui-btn ui-btn-outline-danger font-semibold" type="button" (click)="logout()">
                  Log Out
                </button>
              </div>
            </div>

            <div class="ui-alert mt-6 mb-0"
              [class.ui-alert-danger]="responseCode && responseCode !== 'SUCCESS' && responseCode !== 'CREATED'"
              [class.ui-alert-info]="!responseCode || responseCode === 'SUCCESS' || responseCode === 'CREATED'"
              *ngIf="responseCode || responseMessage"
              role="alert"
            >
              <div><strong>Code:</strong> {{ responseCode }}</div>
              <div><strong>Message:</strong> {{ responseMessage }}</div>
            </div>
          </div>
        </section>
      </div>
    </div>
  </div>
</main>
