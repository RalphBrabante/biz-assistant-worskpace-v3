<section class="page-heading ui-card shadow-panel rounded-xl mb-6 overflow-hidden no-print">
  <div class="ui-card-body p-6 lg:p-12 role-hero">
    <div class="flex flex-wrap justify-between items-end gap-4">
      <div>
        <div class="uppercase tracking-wider text-xs font-semibold text-muted mb-2">Orders</div>
        <h1 class="text-2xl font-semibold tracking-tight mb-2">Delivery Receipt</h1>
        <p class="text-muted mb-0">Print this receipt to go with the delivery and have the customer sign it.</p>
      </div>
      <div class="flex gap-2">
        <a class="ui-btn ui-btn-outline-dark" [routerLink]="['/orders', orderId]"><i class="bi bi-arrow-left mr-1"></i>Back to order</a>
        <button class="ui-btn ui-btn-dark" type="button" *ngIf="receipt()" (click)="print()"><i class="bi bi-printer mr-1"></i>Print Delivery Receipt</button>
      </div>
    </div>
  </div>
</section>
<div *ngIf="error()" class="ui-alert ui-alert-danger no-print">{{ error() }}</div>
<p *ngIf="loading()" class="no-print">Loading delivery receipt…</p>
<section class="ui-card shadow-panel rounded-xl print-delivery-sheet" *ngIf="receipt() as row">
  <div class="ui-card-body p-6">
    <app-delivery-receipt-sheet [receipt]="row"></app-delivery-receipt-sheet>
  </div>
</section>
