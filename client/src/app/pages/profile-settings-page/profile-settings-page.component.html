<section class="ui-card shadow-panel rounded-xl">
  <div class="ui-card-body p-6 md:p-12">
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-2 mb-6">
      <div>
        <h2 class="text-xl font-semibold tracking-tight mb-1">Profile Settings</h2>
        <p class="text-muted mb-0">Update your profile, password, and profile picture.</p>
      </div>
    </div>

    <div *ngIf="loading()" class="ui-alert ui-alert-info">Loading profile...</div>
    <div *ngIf="error()" class="ui-alert ui-alert-danger">{{ error() }}</div>
    <div *ngIf="message()" class="ui-alert ui-alert-success">{{ message() }}</div>

    <form *ngIf="!loading()" (ngSubmit)="saveProfile()" #f="ngForm" class="ui-grid grid grid-cols-12 gap-4">
      <div class="col-span-12 flex items-center gap-4 mb-1">
        <div
          *ngIf="!displayImageUrl"
          class="rounded-full bg-brand-soft text-brand font-bold inline-flex items-center justify-center"
          style="width: 64px; height: 64px; font-size: 1.2rem;"
        >
          {{ initials }}
        </div>
        <img
          *ngIf="displayImageUrl"
          [src]="displayImageUrl"
          alt="Profile picture"
          class="rounded-full border"
          style="width: 64px; height: 64px; object-fit: cover;"
        />

        <div class="grow">
          <label class="ui-form-label font-semibold mb-1">Profile Picture</label>
          <input type="file" class="ui-form-control" accept="image/*" (change)="onFileSelected($event)" />
          <div class="ui-form-text">JPG/PNG up to 5MB.</div>
        </div>
      </div>

      <div class="md:col-span-6">
        <label class="ui-form-label font-semibold">First Name</label>
        <input class="ui-form-control" [(ngModel)]="form['firstName']" name="firstName" required />
      </div>

      <div class="md:col-span-6">
        <label class="ui-form-label font-semibold">Last Name</label>
        <input class="ui-form-control" [(ngModel)]="form['lastName']" name="lastName" required />
      </div>

      <div class="md:col-span-6">
        <label class="ui-form-label font-semibold">Email</label>
        <input class="ui-form-control" type="email" [(ngModel)]="form['email']" name="email" required />
      </div>

      <div class="md:col-span-6">
        <label class="ui-form-label font-semibold">Phone</label>
        <input class="ui-form-control" [(ngModel)]="form['phone']" name="phone" />
      </div>

      <div class="md:col-span-6">
        <label class="ui-form-label font-semibold">Address Line 1</label>
        <input class="ui-form-control" [(ngModel)]="form['addressLine1']" name="addressLine1" />
      </div>

      <div class="md:col-span-6">
        <label class="ui-form-label font-semibold">Address Line 2</label>
        <input class="ui-form-control" [(ngModel)]="form['addressLine2']" name="addressLine2" />
      </div>

      <div class="md:col-span-4">
        <label class="ui-form-label font-semibold">City</label>
        <input class="ui-form-control" [(ngModel)]="form['city']" name="city" />
      </div>

      <div class="md:col-span-4">
        <label class="ui-form-label font-semibold">State</label>
        <input class="ui-form-control" [(ngModel)]="form['state']" name="state" />
      </div>

      <div class="md:col-span-4">
        <label class="ui-form-label font-semibold">Postal Code</label>
        <input class="ui-form-control" [(ngModel)]="form['postalCode']" name="postalCode" />
      </div>

      <div class="md:col-span-6">
        <label class="ui-form-label font-semibold">Country</label>
        <app-country-select [(ngModel)]="form['country']" name="country"></app-country-select>
      </div>

      <div class="md:col-span-6"></div>

      <div class="md:col-span-6">
        <label class="ui-form-label font-semibold">New Password</label>
        <input class="ui-form-control" type="password" [(ngModel)]="form['password']" name="password" autocomplete="new-password" />
      </div>

      <div class="md:col-span-6">
        <label class="ui-form-label font-semibold">Confirm Password</label>
        <input
          class="ui-form-control"
          type="password"
          [(ngModel)]="form['confirmPassword']"
          name="confirmPassword"
          autocomplete="new-password"
        />
      </div>

      <div class="col-span-12 flex justify-end">
        <button class="ui-btn ui-btn-primary" type="submit" [disabled]="submitting() || !f.form.valid">
          <i class="bi bi-save mr-1"></i>{{ submitting() ? 'Saving...' : 'Save Changes' }}
        </button>
      </div>
    </form>
  </div>
</section>
