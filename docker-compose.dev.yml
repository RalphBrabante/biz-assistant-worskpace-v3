services:
  mysql:
    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:5-apache
    container_name: phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: ${MYSQL_USER:-appuser}
      PMA_PASSWORD: ${MYSQL_PASSWORD:-apppassword}
      PMA_ABSOLUTE_URI: http://localhost/db/
    depends_on:
      mysql:
        condition: service_healthy
    expose:
      - "80"

  nginx:
    depends_on:
      - client
      - api
      - phpmyadmin
    volumes:
      - ./nginx/default.dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ./client/dist/angular-client:/usr/share/nginx/html:ro

volumes:
  mysql_data:
